services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:80'
    environment:
      - CDN_API_KEY=${CDN_API_KEY}
    volumes:
      - ./.config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
